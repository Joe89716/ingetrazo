name: Build Python APK (Kivy/Buildozer)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ترقية بيئة السيرفر إلى بايثون 3.14 لتتطابق تلقائياً مع متطلبات الأندرويد
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-dev zip unzip autoconf libtool pkg-config zlib1g-dev cmake ninja-build

      # تثبيت أحدث إصدار متوافق من Cython
      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Configure buildozer.spec
        run: |
          if [ ! -f "buildozer.spec" ]; then
            echo "Generating default buildozer.spec..."
            buildozer init
            sed -i 's/title = My Application/title = PythonApp/g' buildozer.spec
            sed -i 's/package.name = myapp/package.name = pythonapp/g' buildozer.spec
            sed -i 's/package.domain = org.test/package.domain = com.craft.pythonapp/g' buildozer.spec
          fi
          
          # إجبار الأداة على الموافقة التلقائية على تراخيص الأندرويد لتجنب توقف البناء
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec || true
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec || true
          
          # رفع مستوى تفاصيل الأخطاء لمنع الإخفاء
          sed -i 's/log_level = 1/log_level = 2/g' buildozer.spec || true
          sed -i 's/log_level = 0/log_level = 2/g' buildozer.spec || true

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Python-Kivy-APK
          path: bin/*.apk
