name: Build Python APK (Kivy/Buildozer)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update ;
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-dev zip unzip autoconf libtool pkg-config zlib1g-dev ;

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip ;
          pip install buildozer cython virtualenv ;

      - name: Build APK with Buildozer
        run: |
          if [ ! -f "buildozer.spec" ]; then
            echo "Generating default buildozer.spec..." ;
            buildozer init ;
            sed -i 's/title = My Application/title = PythonApp/g' buildozer.spec ;
            sed -i 's/package.name = myapp/package.name = pythonapp/g' buildozer.spec ;
            sed -i 's/package.domain = org.test/package.domain = com.craft.pythonapp/g' buildozer.spec ;
          fi ;
          # إجبار البناء على قبول شروط تراخيص أندرويد تلقائياً
          yes | buildozer android debug ;

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Python-Kivy-APK
          path: bin/*.apk
